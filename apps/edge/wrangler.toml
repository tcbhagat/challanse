name = "challanse-api"
main = "src/index.ts"
compatibility_date = "2026-07-14"
routes = [{ pattern = "api.challanse.constrovet.com", custom_domain = true }]

# ─── D1 Database (relational core + graph overlay) ──────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "challanse-core"
database_id = ""  # $$D1_DATABASE_ID
migrations_dir = "migrations"

# ─── R2 Object Storage (receipt images, audit exports, backups) ────────────
[[r2_buckets]]
binding = "RECEIPTS"
bucket_name = "challanse-receipts"

[[r2_buckets]]
binding = "AUDIT_EXPORTS"
bucket_name = "challanse-audit-exports"

# ─── KV Namespaces (sessions, config cache, rate limiting) ─────────────────
[[kv_namespaces]]
binding = "SESSIONS"
id = ""  # $$SESSIONS_KV_ID
preview_id = ""  # $$SESSIONS_KV_PREVIEW_ID

[[kv_namespaces]]
binding = "CONFIG"
id = ""  # $$CONFIG_KV_ID
preview_id = ""  # $$CONFIG_KV_PREVIEW_ID

[[kv_namespaces]]
binding = "RATE_LIMITS"
id = ""  # $$RATE_LIMITS_KV_ID
preview_id = ""  # $$RATE_LIMITS_KV_PREVIEW_ID

# ─── Queues (event processing, OCR pipeline, audit events) ─────────────────
# Producer bindings use the current `[[queues.producers]]` syntax (wrangler >= 4).
[[queues.producers]]
binding = "RECEIPT_QUEUE"
queue = "receipt-enrichment"

[[queues.producers]]
binding = "AUDIT_QUEUE"
queue = "audit-events"

[[queues.consumers]]
queue = "receipt-enrichment"
max_batch_size = 5
max_batch_timeout = 10
max_retries = 3
dead_letter_queue = "receipt-enrichment-dlq"

[ai]
binding = "AI"

[triggers]
crons = ["17 * * * *"]

# ─── Environment Variables ──────────────────────────────────────────────────
[vars]
ALLOWED_ORIGINS = "https://challanse.constrovet.com,https://guest.challanse.constrovet.com,https://review.challanse.constrovet.com"
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
ENRICHMENT_URL = ""
ENVIRONMENT = "production"
TURNSTILE_SITE_KEY = ""
PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER = "0"
AI_MODEL = "@cf/moondream/moondream3.1-9B-A2B"
AI_DAILY_REQUEST_LIMIT = "25"
GUEST_DAILY_UPLOAD_LIMIT = "50"
GUEST_DAILY_IDENTITY_LIMIT = "3"
GUEST_DAILY_IP_LIMIT = "10"
GUEST_AI_NEURON_BUDGET = "9000"
GUEST_AI_NEURON_RESERVATION = "500"
# External-provider integrations (xAI/Grok, agentmemory) are intentionally
# disabled: these vars must remain empty in both CI and production renders.
GROK_API_BASE_URL = ""

# HMAC signing keys (key rotation supported with NEXT variant)
EDGE_TO_ENRICHMENT_HMAC_KEY_ID = ""
EDGE_TO_ENRICHMENT_NEXT_HMAC_KEY_ID = ""

# agentmemory configuration
AGENTMEMORY_URL = ""
AGENTMEMORY_API_KEY = ""

# ─── Secrets (set via wrangler secret put) ──────────────────────────────────
# TURNSTILE_SECRET
# EDGE_TO_ENRICHMENT_HMAC_KEY
# EDGE_TO_ENRICHMENT_NEXT_HMAC_KEY
# DEVICE_TOKEN_PEPPER
# TENANT_CONTEXT_HMAC_KEY
# PLAY_INTEGRITY_CREDENTIALS_JSON
# XAI_API_KEY (Grok)
# AGENTMEMORY_API_KEY
# SESSION_ENCRYPTION_KEY
# GUEST_IDENTITY_PEPPER
